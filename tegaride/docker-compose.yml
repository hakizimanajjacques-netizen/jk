services:
  db:
    image: postgres:16-alpine
    container_name: tegaride-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tegaride}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tegaride_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-tegaride}
    ports:
      # Bound to localhost only so the DB is not exposed to your network.
      - "127.0.0.1:5432:5432"
    volumes:
      - tegaride_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tegaride_pgdata:
